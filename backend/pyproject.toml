[project]
name = "research-companion"
version = "0.1.0"
description = "Local research assistant with persistent project memory"
requires-python = ">=3.11,<3.14"
dependencies = [
  "deepagents==0.7.13",
  "langchain==1.4.0",
  "langchain-google-genai==4.4.0",
  "langchain-openai==1.6.0",
  "langgraph==1.2.11",
  "langgraph-cli[inmem]==0.4.31",
  "langgraph-api==0.13.4",
  "pydantic==2.13.5",
  "starlette==1.6.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.6", "beautifulsoup4==4.14.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
